  <script>
    (() => {
      const key = "ayush-portfolio-scroll";
      try { history.scrollRestoration = "manual"; } catch (_) {}
      const restore = () => {
        try {
          const y = Number(sessionStorage.getItem(key) || localStorage.getItem(key));
          if (Number.isFinite(y) && y > 0) window.scrollTo(0, y);
        } catch (_) {}
      };
      const save = () => {
        try {
          const y = String(Math.round(window.scrollY));
          sessionStorage.setItem(key, y);
          localStorage.setItem(key, y);
        } catch (_) {}
      };
      window.addEventListener("scroll", save, { passive: true });
      window.addEventListener("beforeunload", save);
      window.addEventListener("pagehide", save);
      window.addEventListener("pageshow", restore);
      window.addEventListener("load", restore);
      restore();
      requestAnimationFrame(restore);
      requestAnimationFrame(() => requestAnimationFrame(restore));
      setTimeout(restore, 100);
      setTimeout(restore, 300);
      setTimeout(restore, 800);
    })();
  </script>
  <body>
    <div id="root"></div>
  </body>
